[package]
name = "colony"
version = "1.2.0"
edition = "2024"
description = "Drive herdr and tmux panes and run a locked Telegram bot"

[lib]
name = "colony"
path = "src/lib.rs"

[[bin]]
name = "colony"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
